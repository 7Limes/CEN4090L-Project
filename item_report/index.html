<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Report</title>

    <!-- RuneScape font -->
    <link href="../fonts/os-font.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../style.css"/>
    <link rel="stylesheet" type="text/css" href="./style.css"/>
</head>
<body>

    <!-- Shared navbar: links live in components/navbar.js -->
    <nav class="navbar"></nav>
    <script src="../components/navbar.js"></script>

    <div class="item-header">
        <div class="item-icon">
            <img id="item-icon" alt="" hidden>
        </div>
        <h1 class="item-name" id="item-name">Loading...</h1>
    </div>

    <div class="item-report" id="item-report">
        <p>Loading report...</p>
    </div>

    <!-- Save report button: saves the report to local storage (save_report.js) -->
    <div class="report-button-container">
        <a class="report-button" id="save-report-button" href="#">Save Report</a>
    </div>

    <script src="./index.js"></script>
    <script src="./save_report.js"></script>
    
    <!-- Compiler for osrs font -->
    <script src="../fonts/os-font.js"></script>
    <script>OsFont.compile();</script>

</body>
</html>
