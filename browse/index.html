<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Items</title>

    <!-- RuneScape font -->
    <link href="../fonts/os-font.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../style.css"/>
    <link rel="stylesheet" type="text/css" href="./style.css"/>
</head>
<body>

    <!-- Shared navbar: links live in components/navbar.js -->
    <nav class="navbar"></nav>
    <script src="../components/navbar.js"></script>

    <h1 class="title">Browse</h1>

    <div class="controls">
        <div>
            <label for="item-search">Search:</label>
            <input type="text"
                    placeholder="Search for an item"
                    id = "item-search"
                    list = "item-datalist"
                    autocomplete="off">
            <datalist id="item-datalist"></datalist>
        </div>
        
        <div>
            <label for="sort-select">Sort:</label>
            <div class="sort-row">
                <select id="sort-select">
                    <option value="price">Price</option>
                    <option value="volume">Daily Volume</option>
                    <option value="highalch">High Alch. Price</option>
                </select>
                <!-- Flips between descending and ascending; text and aria-label are set in index.js -->
                <button type="button" id="sort-direction" class="sort-direction">High to Low</button>
            </div>
        </div>
    </div>

   
    <div class="item-list" id="item-list">
        <div class="item-card">
            <p>Loading items...</p>
        </div>
    </div>

    <div class="page-numbers-container">
        <a>&lt;</a>
        <a>1</a>
        <a>2</a>
        <a>3</a>
        <a>&gt;</a>
    </div>

    <!-- Compiler for osrs font -->
    <script src="../fonts/os-font.js"></script>
    <script>OsFont.compile();</script>

    <script src="./index.js"></script> 
</body>
</html>
