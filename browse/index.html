<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Items</title>

    <!-- RuneScape font -->
    <link href="/fonts/os-font.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="/style.css"/>
    <link rel="stylesheet" type="text/css" href="./style.css"/>
</head>
<body>

    <nav class="navbar">

    </nav>

    <h1 class="title">Browse</h1>

    <div class="controls">
        <div>
            <label>Search:</label>
            <input type="text">
        </div>
        
        <div>
            <label>Sort:</label>
            <select>
                <option>Price</option>
                <option>Daily Volume</option>
                <option>High Alch. Price</option>
            </select>
        </div>
    </div>

    <div class="item-list">
        <div class="item-card">
            <h3>Item 1</h3>
            <p>Item 1 description</p>
        </div>
        <div class="item-card">
            <h3>Item 2</h3>
            <p>Item 2 description</p>
        </div>
        <div class="item-card">
            <h3>Item 3</h3>
            <p>Item 3 description</p>
        </div>
    </div>

    <!-- Compiler for osrs font -->
    <script src="/fonts/os-font.js"></script>
    <script>OsFont.compile();</script>

</body>
</html>
