<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item</title>

    <!-- RuneScape font -->
    <link href="../fonts/os-font.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../style.css"/>
    <link rel="stylesheet" type="text/css" href="./style.css"/>
</head>
<body>

    <!-- Shared navbar: links live in components/navbar.js -->
    <nav class="navbar"></nav>
    <script src="../components/navbar.js"></script>

    <div class="item-header">
        <div class="item-icon">
            <img id="item-icon" alt="" hidden>
        </div>
        <h1 class="item-name" id="item-name">Loading...</h1>
    </div>

    <div class="item-stats">
        <div class="stat">
            <p class="stat-value" id="item-buy-price">-</p>
            <p class="stat-label">Buy Price</p>
        </div>
        <div class="stat">
            <p class="stat-value" id="item-sell-price">-</p>
            <p class="stat-label">Sell Price</p>
        </div>
        <div class="stat">
            <p class="stat-value stat-margin" id="item-margin">-</p>
            <p class="stat-label">Margin</p>
        </div>
        <div class="stat">
            <p class="stat-value" id="item-volume">-</p>
            <p class="stat-label">Daily Volume</p>
        </div>
        <div class="stat">
            <p class="stat-value" id="item-limit">-</p>
            <p class="stat-label">Buy Limit</p>
        </div>
    </div>

    <div class="item-details">
        <div class="item-panel item-description">
            <h3>Description</h3>
            <p id="item-description">-</p>
        </div>

        <div class="item-panel item-sell-value">
            <h3>Sell Value</h3>
            <p id="item-high-alch">High alch: -</p>
            <p id="item-low-alch">Low alch: -</p>
        </div>
    </div>

    <!-- Report settings: front end only for now, not wired to the report/backtester yet -->
    <details class="report-settings">
        <summary>Report Settings</summary>
        <div class="report-settings-fields">
            <div class="report-field">
                <label for="report-budget">Budget (gp)</label>
                <input id="report-budget" name="budget" type="number" min="0" step="1" placeholder="e.g. 10000000">
            </div>
            <div class="report-field">
                <label for="report-window">Time Window</label>
                <select id="report-window" name="window">
                    <option value="7d">Last 7 days</option>
                    <option value="1m" selected>Last month</option>
                    <option value="6m">Last 6 months</option>
                    <option value="1y">Last year</option>
                </select>
            </div>
        </div>

        <!-- Buy and sell rules (issue #72). Rows are built from #condition-template by report_settings.js -->
        <fieldset class="condition-group" data-group="buy">
            <legend>Buy Conditions</legend>
            <ol class="condition-list"></ol>
            <div class="condition-combine">
                <span>Combine another condition? (optional)</span>
                <button type="button" class="condition-button condition-add" data-join="and" aria-label="Add a buy condition joined with AND">+ AND</button>
                <button type="button" class="condition-button condition-add" data-join="or" aria-label="Add a buy condition joined with OR">+ OR</button>
            </div>
        </fieldset>

        <fieldset class="condition-group" data-group="sell">
            <legend>Sell Conditions</legend>
            <ol class="condition-list"></ol>
            <div class="condition-combine">
                <span>Combine another condition? (optional)</span>
                <button type="button" class="condition-button condition-add" data-join="and" aria-label="Add a sell condition joined with AND">+ AND</button>
                <button type="button" class="condition-button condition-add" data-join="or" aria-label="Add a sell condition joined with OR">+ OR</button>
            </div>
        </fieldset>
    </details>

    <!-- One condition row, shared by the buy and sell groups. report_settings.js fills in ids and names -->
    <template id="condition-template">
        <li class="condition">
            <fieldset class="condition-join">
                <legend class="visually-hidden">Combine with the condition above using</legend>
                <label><input type="radio" value="and"> AND</label>
                <label><input type="radio" value="or"> OR</label>
            </fieldset>
            <div class="condition-fields">
                <div class="report-field">
                    <label data-for="metric">Metric</label>
                    <select data-field="metric">
                        <option value="" selected disabled>Choose a metric</option>
                        <option value="price">Current price (gp)</option>
                        <option value="price_change">Price change (%)</option>
                        <option value="volume">Trade volume</option>
                        <option value="margin">GE margin (gp)</option>
                    </select>
                </div>
                <div class="report-field">
                    <label data-for="operator">Operator</label>
                    <select data-field="operator">
                        <option value="" selected disabled>Choose an operator</option>
                        <option value="gt">more than (&gt;)</option>
                        <option value="lt">less than (&lt;)</option>
                        <option value="gte">at least (&ge;)</option>
                        <option value="lte">at most (&le;)</option>
                    </select>
                </div>
                <div class="report-field">
                    <label data-for="threshold">Threshold</label>
                    <input data-field="threshold" type="number" step="any" placeholder="e.g. 25">
                </div>
                <button type="button" class="condition-button condition-remove">Remove</button>
            </div>
        </li>
    </template>

    <div class="report-button-container">
        <a class="report-button" id="report-button" href="../item_report/index.html">Generate Report</a>
    </div>

    <script src="./index.js"></script>
    <script src="./report_settings.js"></script>

    <!-- Compiler for osrs font -->
    <script src="../fonts/os-font.js"></script>
    <script>OsFont.compile();</script>

</body>
</html>
