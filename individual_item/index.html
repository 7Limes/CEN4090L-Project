<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item</title>

    <!-- RuneScape font -->
    <link href="../fonts/os-font.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../style.css"/>
    <link rel="stylesheet" type="text/css" href="./style.css"/>
</head>
<body>

    <nav class="navbar">

    </nav>

    <div class="item-header">
        <div class="item-icon">
            Item icon placeholder
        </div>
        <h1 class="item-name">Item name</h1>
    </div>

    <div class="item-stats">
        <div class="stat">
            <p class="stat-value">0 gp</p>
            <p class="stat-label">Buy Price</p>
        </div>
        <div class="stat">
            <p class="stat-value">0 gp</p>
            <p class="stat-label">Sell Price</p>
        </div>
        <div class="stat">
            <p class="stat-value stat-margin">+0 gp</p>
            <p class="stat-label">Margin</p>
        </div>
        <div class="stat">
            <p class="stat-value">0</p>
            <p class="stat-label">Daily Volume</p>
        </div>
        <div class="stat">
            <p class="stat-value">0</p>
            <p class="stat-label">Buy Limit</p>
        </div>
    </div>

    <div class="item-details">
        <div class="item-panel item-description">
            <h3>Description</h3>
            <p>Item description placeholder</p>
        </div>

        <div class="item-panel item-sell-value">
            <h3>Sell Value</h3>
            <p>Sell value placeholder</p>
        </div>
    </div>

    <div class="report-button-container">
        <a class="report-button" href="../item_report/index.html">View Historic Report</a>
    </div>

    <!-- Compiler for osrs font -->
    <script src="../fonts/os-font.js"></script>
    <script>OsFont.compile();</script>

</body>
</html>
