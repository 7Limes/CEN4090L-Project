<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuneReport</title>

    <!-- RuneScape font -->
    <link href="fonts/os-font.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>

    <!-- Shared navbar: links live in components/navbar.js -->
    <nav class="navbar"></nav>
    <script src="components/navbar.js"></script>

    <div class="page-layout">
        <main class="main-content">
            <h1 class="title">RuneReport</h1>

            <div class="searchbar">
                <input type="text" placeholder="Search for an item">
            </div>
            <a class="browse-all-link" href="browse/index.html">Browse all items</a>
        </main>

        <aside class="most-traded">
            <h2 class="most-traded-title">Most Traded Today</h2>
            <ul class="most-traded-list">
                <li class="traded-item">
                    <a href ="/individual_item/index.html">
                        <span class="traded-item-name">Magic logs</span>
                    </a>
                    <span class="traded-item-volume">1.2M traded</span>
                </li>
                <li class="traded-item">
                    <a href ="/individual_item/index.html">
                        <span class="traded-item-name">Prayer potion(4)</span>
                    </a>
                    <span class="traded-item-volume">845K traded</span>
                </li>
                <li class="traded-item">
                    <a href ="/individual_item/index.html">
                        <span class="traded-item-name">Dragon bones</span>
                    </a>
                    <span class="traded-item-volume">310K traded</span>
                </li>
                <li class="traded-item">
                    <a href ="/individual_item/index.html">
                        <span class="traded-item-name">Rune platebody</span>
                    </a>
                    <span class="traded-item-volume">42K traded</span>
                </li>
                <li class="traded-item">
                    <a href ="/individual_item/index.html">
                        <span class="traded-item-name">Abyssal whip</span>
                    </a>
                    <span class="traded-item-volume">6.5K traded</span>
                </li>
            </ul>
        </aside>
    </div>

    <!-- Compiler for osrs font -->
    <script src="fonts/os-font.js"></script>
    <script>OsFont.compile();</script>

    <script src="index.js"></script>        
</body>
</html>
