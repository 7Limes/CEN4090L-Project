<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuneReport</title>

    <!-- RuneScape font -->
    <link href="fonts/os-font.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>

    <nav class="navbar">
        <ul class="navbar-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Strategy Tester</a></li>
            <li><a href="#">Watchlist</a></li>
            <li><a href="#">My Strategies</a></li>
        </ul>
    </nav>

    <div class="page-layout">
        <main class="main-content">
            <h1 class="title">RuneReport</h1>
            
            <div class="searchbar">
                <input type="text" placeholder="Search for an item">
            </div> 
        </main>

        <aside class="best-deals">
            <h2 class="best-deals-title">Best Deals</h2>
            <ul class="best-deals-list">
                <li class="deal">
                    <span class="deal-name">Abyssal whip</span>
                    <span class="deal-margin">+45,000 gp</span>
                </li>
                <li class="deal">
                    <span class="deal-name">Prayer potion(4)</span>
                    <span class="deal-margin">+320 gp</span>
                </li>
                <li class="deal">
                    <span class="deal-name">Magic logs</span>
                    <span class="deal-margin">+18 gp</span>
                </li>
                <li class="deal">
                    <span class="deal-name">Dragon bones</span>
                    <span class="deal-margin">+150 gp</span>
                </li>
                <li class="deal">
                    <span class="deal-name">Rune platebody</span>
                    <span class="deal-margin">+900 gp</span>
                </li>
            </ul>
        </aside>
    </div>

    <!-- Compiler for osrs font -->
    <script src="fonts/os-font.js"></script>
    <script>OsFont.compile();</script>

    <script src="index.js"></script>        
</body>
</html>
