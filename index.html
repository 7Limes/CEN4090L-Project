<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuneReport</title>

    <!-- RuneScape font -->
    <link href="fonts/os-font.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>

    <!-- Shared navbar: links live in components/navbar.js -->
    <nav class="navbar"></nav>
    <script src="components/navbar.js"></script>

    <div class="page-layout">
        <main class="main-content">
            <h1 class="title">RuneReport</h1>

            <div class="searchbar">
                <input type="text" 
                       placeholder="Search for an item"
                       id = "item-search"
                       list ="item-datalist"
                       autocomplete="off"
                >
                <datalist id="item-datalist"></datalist>
            </div>
            <a class="browse-all-link" href="browse/index.html">Browse all items</a>
        </main>

        <aside class="best-deals">
            <h2 class="best-deals-title">Best Deals</h2>
            <ul id="best-deals-list" class="best-deals-list">
                <li class="traded-item">Loading deals...</li>
            </ul>
        </aside>
    </div>

    <!-- Compiler for osrs font -->
    <script src="fonts/os-font.js"></script>
    <script>OsFont.compile();</script>

    <script src="index.js"></script>        
</body>
</html>
